    /* ─────────────────────────────────────────
       DESIGN TOKENS – exact values from Figma
       ───────────────────────────────────────── */
    :root {
      /* Surface – saisonal (Mathematik = orange/color-4) */
      --color-header-bg:   #fef5ec;   /* =Menü-Hintergrund für nahtlosen Übergang */
      --color-page-bg:     #fbd4b0;   /* surface/saisonal/color-4-default  */
      --color-primary:     #964f12;   /* surface/saisonal/color-4-selected */
      --color-fab:         #f4a056;
      --nk-fab-bg:         #f4a056;
      --nk-fab-color:      #00363d;

      /* CTA / level chips */
      --color-chip-active: #ed4790;   /* action/cta/saisonal/cta-default            */
      --color-chip-on:     #f8fdff;   /* action/nav/surfaces/standard-button-selected */

      /* Score panel */
      --color-panel-bg:    #fde5cd;   /* colors/saisonal/orange/100  */
      --color-correct:     #4f8e33;   /* colors/saisonal/hellgruen/600 */
      --color-error:       #d2283b;   /* colors/main-colors/error      */

      /* Clock */
      --color-hours:       #2d4f38;   /* surface/legends/hours   */
      --color-minutes:     #b3261e;   /* surface/legends/minutes */
      --color-clock-nums:  #221b00;   /* layout/clock/design     */

      /* Neutral */
      --color-neutral:     #191c1d;   /* colors/neutral-grey/950 */

      /* Typography */
      --font-logo:    'Alcyone', 'Solway', Georgia, serif;
      --font-heading: 'Solway', Georgia, serif;
      --font-body:    'Noto Sans', Arial, sans-serif;

      /* Spacing */
      --sp-xs:  6px;
      --sp-s:   8px;
      --sp-m2: 12px;
      --sp-m4: 16px;
      --sp-m5: 18px;
      --sp-m6: 24px;
      --sp-m8: 32px;

      /* Border radius */
      --r-chip:   120px;
      --r-choice:  16px;
      --r-radio:   64px;
      --r-panel:   16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-page-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--color-neutral);
    }

    /* ── Header → components/header.css ─────── */

    /* ── Breadcrumb → components/breadcrumb.css ─ */

    /* ── Page layout ─────────────────────────── */
    .page {
      flex: 1;
    }
    .main {
      padding: 27px 56px 80px;
    }

    /* Wrapper: aligns the content block + score panel side by side,
       panel height = content height only */
    .exercise-wrapper {
      display: flex;
      align-items: flex-start;   /* panel stops at content bottom */
    }
    .exercise-content {
      flex: 1;
      min-width: 0;
    }

    /* Score-Panel styles → components/score-panel.css */

    /* ── Exercise title + chips → components/exercise-header.css ── */

    /* ── Exercise area ───────────────────────── */
    .exercise-area {
      display: flex;
      gap: var(--sp-m8);
      align-items: center;
    }

    /* ── Clock ───────────────────────────────── */
    .clock-col {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-m2);
    }
    .clock-wrap {
      width: 256px;
      height: 256px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #clockSvg {
      width: 252px;
      height: 252px;
      filter:
        drop-shadow(4px 6px 8px rgba(0,0,0,0.22))
        drop-shadow(2px 3px 2px rgba(0,0,0,0.14));
    }

    /* ── Legend ──────────────────────────────── */
    .legend {
      display: flex;
      gap: var(--sp-m6);
      padding-left: 4px;
      margin-top: 40px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--sp-s);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 24px;
      letter-spacing: 0.25px;
      color: var(--color-neutral);
    }
    .legend-dot {
      width: 20px;
      height: 20px;
      border-radius: var(--r-panel);
      flex-shrink: 0;
    }
    .dot-hours   { background: var(--color-hours); }
    .dot-minutes { background: var(--color-minutes); }

    /* ── Q&A column ──────────────────────────── */
    .qa-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--sp-m8);
      min-width: 0;
    }
    .question-text {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 400;
      line-height: 32px;
      color: var(--color-primary);
    }

    /* ── Choice chips ────────────────────────── */
    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-m4);
      align-items: center;
    }
    .choice-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-xs);
      padding: var(--sp-s) var(--sp-m5);
      border: 1px solid var(--color-primary);
      border-radius: var(--r-choice);
      background: transparent;
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 400;
      line-height: 28px;
      letter-spacing: 0.25px;
      color: var(--color-primary);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .choice-radio {
      display: none;
    }
    .choice-btn:hover:not(:disabled) {
      background: rgba(150,79,18,0.08);
    }
    .choice-btn.is-correct {
      background: rgba(79,142,51,0.12);
      border-color: var(--color-correct);
      color: var(--color-correct);
    }
    .choice-btn.is-correct .choice-radio {
      background: var(--color-correct);
      border-color: var(--color-correct);
    }
    .choice-btn.is-wrong {
      background: rgba(210,40,59,0.10);
      border-color: var(--color-error);
      color: var(--color-error);
    }
    .choice-btn.is-wrong .choice-radio {
      background: var(--color-error);
      border-color: var(--color-error);
    }
    .choice-btn:disabled { cursor: default; }

    /* ── Feedback ────────────────────────────── */
    .feedback {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 700;
      line-height: 28px;
      min-height: 28px;
      color: var(--color-primary);
    }
    .feedback.is-correct { color: var(--color-correct); }
    .feedback.is-wrong   { color: var(--color-error); }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 900px) {
      .main { padding-left: 20px; padding-right: 20px; }
      .exercise-area { flex-direction: column; align-items: flex-start; }
      .exercise-title { font-size: 24px; }
      .score-panel { width: 72px; }
    }

  <script>
    'use strict';

    /* ─── Vorlese-Text ───────────────────────
       Beschreibt die Übung für den Nutzer.
       Bei Änderungen am UI diesen Text anpassen.
       ───────────────────────────────────────── */
    var voiceText =
      'Hey! Kannst du eine Uhr lesen? Schau mal — die Uhr hat zwei Zeiger. ' +
      'Der grüne zeigt die Stunden, der rote zeigt die Minuten. ' +
      'Welche Zeit zeigt die Uhr gerade? Tipp einfach auf deine Antwort — du schaffst das!';

    /* ─── State ───────────────────────────── */
    var CX = 125, CY = 125;
    var level = 1;
    var correctAnswer = '';
    var answered = false;
    var round = 0;
    var MAX_ROUNDS = 10;

    /* ─── ScorePanel instance ──────────────── */
    var scorePanel = new ScorePanel(document.getElementById('scorePanel'), {
      timerDuration: 3000
    });

    /* ─── Build static clock face ─────────── */
    function buildClockFace() {
      var tickG   = document.getElementById('tickGroup');
      var numberG = document.getElementById('numberGroup');
      var svgNS   = 'http://www.w3.org/2000/svg';
      var i, n, angle, innerR, x1, y1, x2, y2, line, x, y, txt;

      for (i = 0; i < 60; i++) {
        var isMajor = (i % 5 === 0);
        angle  = (i / 60) * 2 * Math.PI - Math.PI / 2;
        innerR = isMajor ? 106 : 112;
        x1 = CX + innerR * Math.cos(angle);
        y1 = CY + innerR * Math.sin(angle);
        x2 = CX + 120    * Math.cos(angle);
        y2 = CY + 120    * Math.sin(angle);

        line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('stroke',        '#964f12');
        line.setAttribute('stroke-width',  isMajor ? '2' : '1');
        line.setAttribute('stroke-linecap','round');
        if (!isMajor) line.setAttribute('opacity', '0.5');
        tickG.appendChild(line);
      }

      for (n = 1; n <= 12; n++) {
        angle = (n / 12) * 2 * Math.PI - Math.PI / 2;
        x = CX + 91 * Math.cos(angle);
        y = CY + 91 * Math.sin(angle);
        txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', x);
        txt.setAttribute('y', y);
        txt.setAttribute('text-anchor',       'middle');
        txt.setAttribute('dominant-baseline', 'central');
        txt.setAttribute('font-size',         '18');
        txt.setAttribute('font-weight',       '400');
        txt.setAttribute('fill',              '#221b00');
        txt.setAttribute('font-family',       "'Noto Sans', Arial, sans-serif");
        txt.textContent = n;
        numberG.appendChild(txt);
      }
    }

    /* ─── Rotate a hand (degrees from 12 o'clock) ── */
    function setHand(id, degrees) {
      document.getElementById(id).setAttribute(
        'transform',
        'translate(' + CX + ',' + CY + ') rotate(' + degrees + ')'
      );
    }

    /* ─── Random time per level ────────────── */
    var lastTime = null;
    function randomTime() {
      var hours, minutes, pool;
      var minutePools = {
        1: [0],
        2: [0, 30],
        3: [0, 15, 30, 45],
        4: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
      };
      pool = minutePools[level];
      var attempts = 0;
      do {
        hours   = Math.floor(Math.random() * 12) + 1;
        minutes = pool[Math.floor(Math.random() * pool.length)];
        attempts++;
      } while (
        lastTime &&
        hours === lastTime.hours &&
        minutes === lastTime.minutes &&
        attempts < 20
      );
      lastTime = { hours: hours, minutes: minutes };
      return lastTime;
    }

    /* ─── Zahlwörter 1–12 ──────────────────── */
    var ZAHLWORT = ['', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs',
                    'sieben', 'acht', 'neun', 'zehn', 'elf', 'zwölf'];

    /* ─── Format time as German string ─────── */
    function formatTime(t, useWord) {
      var next = t.hours === 12 ? 1 : t.hours + 1;
      var h    = useWord ? ZAHLWORT[t.hours] : t.hours;
      var hn   = useWord ? ZAHLWORT[next]    : next;
      if (t.minutes === 0)  return (h === 'eins' ? 'ein' : h) + ' Uhr';
      if (t.minutes === 15) return 'Viertel nach ' + h;
      if (t.minutes === 30) return 'halb ' + hn;
      if (t.minutes === 45) return 'Viertel vor ' + hn;
      return t.hours + ':' + (t.minutes < 10 ? '0' : '') + t.minutes + ' Uhr';
    }

    /* ─── Build 4 shuffled answer strings ───── */
    function generateAnswers(correctTime) {
      /* One useWord decision per question — all buttons use the same format */
      var useWord = Math.random() < 0.5;
      var correctStr = formatTime(correctTime, useWord);
      correctAnswer = correctStr;
      var minutePools = {
        1: [0],
        2: [0, 30],
        3: [0, 15, 30, 45],
        4: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
      };
      var mins = minutePools[level];
      var pool = [], h, m, s, i, j, a, b, tmp;

      for (h = 1; h <= 12; h++) {
        for (m = 0; m < mins.length; m++) {
          if (h === correctTime.hours && mins[m] === correctTime.minutes) continue;
          s = formatTime({ hours: h, minutes: mins[m] }, useWord);
          pool.push(s);
        }
      }
      for (i = pool.length - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      var opts = [correctStr];
      for (i = 0; opts.length < 4 && i < pool.length; i++) opts.push(pool[i]);
      for (a = opts.length - 1; a > 0; a--) {
        b = Math.floor(Math.random() * (a + 1));
        tmp = opts[a]; opts[a] = opts[b]; opts[b] = tmp;
      }
      return opts;
    }

    /* ─── Render answer buttons ─────────────── */
    function renderAnswers(answers) {
      var container = document.getElementById('choices');
      container.innerHTML = '';
      for (var i = 0; i < answers.length; i++) {
        (function(ans) {
          var btn   = document.createElement('button');
          btn.className       = 'choice-btn';
          btn.dataset.answer  = ans;  /* safe comparison key */

          var radio = document.createElement('span');
          radio.className = 'choice-radio';
          radio.setAttribute('aria-hidden', 'true');
          btn.appendChild(radio);
          btn.appendChild(document.createTextNode(ans));

          btn.addEventListener('click', function() { checkAnswer(ans, btn); });
          container.appendChild(btn);
        })(answers[i]);
      }
    }

    /* ─── Next question ─────────────────────── */
    function nextQuestion() {
      scorePanel.stopTimer();
      answered = false;
      var fb = document.getElementById('feedback');
      fb.textContent = '';
      fb.className   = 'feedback';

      var time = randomTime();

      setHand('hourHand',   (time.hours % 12) / 12 * 360 + time.minutes / 60 * 30);
      setHand('minuteHand', time.minutes / 60 * 360);
      renderAnswers(generateAnswers(time));
    }

    /* ─── Check answer ──────────────────────── */
    function checkAnswer(selected, btn) {
      if (answered) return;
      answered = true;
      round++;

      var allBtns = document.querySelectorAll('.choice-btn');
      for (var i = 0; i < allBtns.length; i++) {
        allBtns[i].disabled = true;
        if (allBtns[i].dataset.answer === correctAnswer) {
          allBtns[i].classList.add('is-correct');
        }
      }

      var fb = document.getElementById('feedback');
      if (selected === correctAnswer) {
        scorePanel.increment('correct');
        var praise = ['Super! 🎉', 'Genau richtig!', 'Toll gemacht!', 'Richtig! ⭐'];
        fb.textContent = praise[Math.floor(Math.random() * praise.length)];
        fb.className   = 'feedback is-correct';
      } else {
        scorePanel.increment('wrong');
        btn.classList.add('is-wrong');
        fb.textContent = 'Fast! Es war: ' + correctAnswer;
        fb.className   = 'feedback is-wrong';
      }

      if (round >= MAX_ROUNDS) {
        scorePanel.startTimer(showEndScreen);
      } else {
        scorePanel.startTimer(nextQuestion);
      }
    }

    /* ─── End screen ────────────────────────── */
    function showEndScreen() {
      var scores = scorePanel.getScores();
      document.getElementById('endScore').textContent =
        scores.correct + ' von ' + MAX_ROUNDS + ' richtig';
      document.getElementById('endScreen').style.display = 'flex';
    }

    document.getElementById('restartBtn').addEventListener('click', function() {
      document.getElementById('endScreen').style.display = 'none';
      round = 0;
      scorePanel.reset();
      nextQuestion();
    });

    /* ─── Übungsblatt als PDF generieren ───────
       Zeichnet 5 Uhren (passend zum aktuellen Level)
       mit je 4 Multiple-Choice-Antworten auf A4.   */
    function generateWorksheetPDF() {
      function build() {
        var JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        if (!JsPDF) { return; }
        var doc = new JsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        var W = 210;

        /* ── Uhr auf PDF zeichnen ─────────────── */
        function drawClockPDF(cx, cy, r, h, m) {
          doc.setFillColor(255, 255, 255);
          doc.setDrawColor(150, 79, 18);
          doc.setLineWidth(0.55);
          doc.circle(cx, cy, r, 'FD');

          for (var i = 0; i < 60; i++) {
            var major = (i % 5 === 0);
            var ang = (i / 60) * 2 * Math.PI;
            var ir = major ? r * 0.82 : r * 0.905;
            doc.setLineWidth(major ? 0.44 : 0.17);
            doc.setDrawColor(150, 79, 18);
            doc.line(cx + ir * Math.sin(ang), cy - ir * Math.cos(ang),
                     cx + r  * Math.sin(ang), cy - r  * Math.cos(ang));
          }

          doc.setFontSize(5.5);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(34, 27, 0);
          for (var n = 1; n <= 12; n++) {
            var na = (n / 12) * 2 * Math.PI;
            doc.text(String(n),
              cx + (r * 0.70) * Math.sin(na),
              cy - (r * 0.70) * Math.cos(na),
              { align: 'center', baseline: 'middle' });
          }

          /* Stundenzeiger – kurz, dick, dunkelgrün */
          var ha = ((h % 12) / 12 + m / 720) * 2 * Math.PI;
          doc.setLineWidth(1.1);  doc.setDrawColor(45, 79, 56);
          doc.line(cx, cy, cx + (r * 0.52) * Math.sin(ha), cy - (r * 0.52) * Math.cos(ha));

          /* Minutenzeiger – lang, dünner, rot */
          var ma = (m / 60) * 2 * Math.PI;
          doc.setLineWidth(0.65); doc.setDrawColor(179, 38, 30);
          doc.line(cx, cy, cx + (r * 0.79) * Math.sin(ma), cy - (r * 0.79) * Math.cos(ma));

          doc.setFillColor(34, 27, 0);
          doc.circle(cx, cy, 0.85, 'F');
        }

        /* ── 5 Aufgaben generieren ────────────── */
        var pools = { 1: [0], 2: [0, 30], 3: [0, 15, 30, 45],
                      4: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55] };
        var pool = pools[level] || pools[3];
        var exercises = [], used = {};

        for (var e = 0; e < 5; e++) {
          var eh, em, key, att = 0;
          do {
            eh = Math.floor(Math.random() * 12) + 1;
            em = pool[Math.floor(Math.random() * pool.length)];
            key = eh + '_' + em;
            att++;
          } while (used[key] && att < 40);
          used[key] = true;

          var useWord = Math.random() < 0.5;
          var correct = formatTime({ hours: eh, minutes: em }, useWord);

          /* 3 Distraktoren – gleiche Wortform */
          var wrongAll = [], wh, wi;
          for (wh = 1; wh <= 12; wh++) {
            for (wi = 0; wi < pool.length; wi++) {
              if (wh === eh && pool[wi] === em) continue;
              wrongAll.push(formatTime({ hours: wh, minutes: pool[wi] }, useWord));
            }
          }
          for (var si = wrongAll.length - 1; si > 0; si--) {
            var sj = Math.floor(Math.random() * (si + 1));
            var st = wrongAll[si]; wrongAll[si] = wrongAll[sj]; wrongAll[sj] = st;
          }
          var opts = [correct, wrongAll[0], wrongAll[1], wrongAll[2]];
          for (var oi = opts.length - 1; oi > 0; oi--) {
            var oj = Math.floor(Math.random() * (oi + 1));
            var ot = opts[oi]; opts[oi] = opts[oj]; opts[oj] = ot;
          }
          exercises.push({ h: eh, m: em, opts: opts });
        }

        /* ── Kopfzeile ────────────────────────── */
        var ML = 18;
        doc.setFontSize(8);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(190, 130, 70);
        doc.text('nasenklammer.de', W - ML, 11, { align: 'right' });

        doc.setFontSize(20);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(34, 27, 0);
        doc.text('Uhrzeit üben', W / 2, 21, { align: 'center' });

        var lvlLabel = ['', 'Ganze Stunden', 'Halbe Stunden',
                         'Viertelstunden', 'Gemischt'][level] || '';
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(110, 110, 110);
        doc.text('Welche Zeit zeigt die Uhr? Kreise die richtige Antwort ein. · ' + lvlLabel,
          W / 2, 28, { align: 'center' });

        doc.setFontSize(10);
        doc.setTextColor(80, 80, 80);
        doc.text('Name: _________________________', ML, 34);
        doc.text('Datum: _____________', 148, 34);

        doc.setDrawColor(210, 210, 210);
        doc.setLineWidth(0.3);
        doc.line(ML, 38, W - ML, 38);

        /* ── Aufgabenzeilen ───────────────────── */
        var rowH   = 48;
        var startY = 40;
        var clkCX  = ML + 24;       /* Uhr-Mittelpunkt x */
        var clkR   = 18;            /* Radius in mm      */
        var divX   = ML + 48;       /* Trennlinie x      */
        var cX1    = divX + 7;      /* Antwortspalte 1   */
        var cX2    = cX1  + 65;     /* Antwortspalte 2   */

        for (var r = 0; r < 5; r++) {
          var ex   = exercises[r];
          var rowY = startY + r * rowH;

          if (r > 0) {
            doc.setDrawColor(220, 220, 220);
            doc.setLineWidth(0.25);
            doc.line(ML, rowY, W - ML, rowY);
          }

          /* Aufgabennummer */
          doc.setFontSize(9);
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(150, 79, 18);
          doc.text(String(r + 1) + '.', ML, rowY + rowH / 2 + 1);

          /* Uhr */
          drawClockPDF(clkCX, rowY + rowH / 2, clkR, ex.h, ex.m);

          /* Vertikale Trennlinie */
          doc.setDrawColor(220, 220, 220);
          doc.setLineWidth(0.25);
          doc.line(divX, rowY + 6, divX, rowY + rowH - 6);

          /* 4 Antworten im 2×2-Raster */
          var positions = [
            { x: cX1, y: rowY + 14 },
            { x: cX2, y: rowY + 14 },
            { x: cX1, y: rowY + 34 },
            { x: cX2, y: rowY + 34 }
          ];
          for (var ci = 0; ci < 4; ci++) {
            var cp = positions[ci];
            doc.setDrawColor(150, 79, 18);
            doc.setLineWidth(0.38);
            doc.circle(cp.x + 3, cp.y - 0.5, 2.8);
            doc.setFontSize(10.5);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(25, 28, 29);
            doc.text(ex.opts[ci], cp.x + 9.5, cp.y, { baseline: 'middle' });
          }
        }

        /* ── Fußzeile ─────────────────────────── */
        doc.setFontSize(7.5);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(190, 190, 190);
        doc.text(
          'Automatisch generiert von nasenklammer.de – kostenlos und werbefrei.',
          W / 2, 291, { align: 'center' });

        NKWorksheetPDF.preview(doc, 'nasenklammer-uhrzeit-uebungsblatt.pdf');
      }

      NKWorksheetPDF.load(build);
    }

    /* ─── FAB (Lasche) ──────────────────────── */
    var fab = new NKFab(document.getElementById('siteFab'), {
      mode: 'module',
      onSpeak: function() { NKVoice.speak(voiceText, function() { fab.done(); }); },
      onStop:  function() { NKVoice.stop(); },
    });

    /* ─── Init ──────────────────────────────── */
    var menu = new NKMenu(
      document.getElementById('siteMenu'),
      Object.assign({}, NKMenu.THEMES.mathematik, {
        activeHref: 'uhr.html',
        headerEl: document.getElementById('siteHeader'),
        onItemClick: function(item) {
          console.log('Navigiere zu:', item.label, item.href);
          /* TODO: Seitennavigation */
        }
      })
    );

    var header = new NKHeader(
      document.getElementById('siteHeader'),
      Object.assign({}, NKHeader.THEMES.mathematik, {
        homeHref: 'index.html',
        onMenuClick: function() { menu.toggle(); }
      })
    );

    var exHeader = new NKExerciseHeader(
      document.getElementById('exerciseHeader'),
      {
        title: 'Ich weiß, wie spät es ist',
        chips: [
          { label: 'Ganze Stunden',  value: 1 },
          { label: 'Halbe Stunden',  value: 2 },
          { label: 'Viertelstunden', value: 3 },
          { label: 'Gemischt',       value: 4 },
        ],
        activeValue: 1,
        onChipChange: function(value) {
          level = value;
          nextQuestion();
        }
      }
    );

    var breadcrumb = new NKBreadcrumb(
      document.getElementById('siteBreadcrumb'),
      Object.assign({}, NKBreadcrumb.THEMES.mathematik, {
        themaConnector: 'die',
        slots: {
          klasse: { label: 'Grundschulkind', href: 'index.html' },
          fach:   { label: 'Mathematik',     href: 'grundschule-faecher.html' },
          thema:  { label: 'Uhrzeit',        href: 'grundschule.html' },
        },
        menuItems: [
          { label: 'Übungsblatt ausdrucken', icon: 'print',
            onClick: function() { generateWorksheetPDF(); } }
        ],
        onSlotClick: function(key, slot) {
          if (slot.href) window.location.href = slot.href;
        }
      })
    );

    buildClockFace();
    nextQuestion();
  </script>
