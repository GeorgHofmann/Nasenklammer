  <title>Vorschulkind – Mathematik – Nasenklammer</title>
  <link rel="stylesheet" href="components/fonts.css">
  <link rel="stylesheet" href="components/transitions.css">
  <link rel="stylesheet" href="components/logo.css">
  <link rel="stylesheet" href="components/header.css">
  <link rel="stylesheet" href="components/menu.css">
  <link rel="stylesheet" href="components/card.css">
  <link rel="stylesheet" href="components/search.css">
  <link rel="stylesheet" href="components/fab.css">
  <style>
    :root {
      --font-logo:    'Alcyone', 'Solway', Georgia, serif;
      --font-heading: 'Solway', Georgia, serif;
      --font-body:    'Noto Sans', Arial, sans-serif;

      --color-bg:      #fbd4b0;
      --color-accent:  #964f12;
      --nk-card-color: #964f12;
      --nk-fab-bg:     #f4a056;
      --nk-fab-color:  #00363d;
      --nk-search-panel-bg:   rgba(248,212,178,0.97);
      --nk-search-trigger-bg: rgba(253,220,185,0.62);
      --nk-search-icon-bg:    #f4a056;
      --nk-search-text:       #6a3010;
      --nk-search-placeholder:#b07840;
      --nk-search-accent:     #964f12;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Breadcrumb-Strip ────────────────────── */
    .gs-strip {
      background: var(--color-bg);
      padding: 21px 56px;
    }

    .gs-strip__text {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 400;
      line-height: 40px;
      color: var(--color-accent);
      white-space: nowrap;
    }

    .gs-strip__link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      cursor: pointer;
    }

    .gs-strip__link:hover {
      opacity: 0.75;
    }

    /* ── Übungs-Karten ───────────────────────── */
    .gs-main {
      flex: 1;
      padding: 48px 56px 160px;
    }

    @media (max-width: 900px) {
      .gs-strip   { padding: 16px 20px; }
      .gs-strip__text { font-size: 22px; white-space: normal; }
      .gs-main    { padding: 32px 20px 140px; }
    }
  </style>
</head>
<body>

  <div id="siteMenu"></div>
  <header id="siteHeader"></header>

  <!-- Strip: Ich bin ein … und übe in Meine Welt … -->
  <div class="gs-strip">
    <p class="gs-strip__text">
      Ich bin ein
      <a class="gs-strip__link" href="index.html">Vorschulkind</a>
      und übe in
      <a class="gs-strip__link" href="vorschule.html">Meine Welt</a>
      …
    </p>
  </div>

  <!-- Übungs-Karten -->
  <main class="gs-main">
    <div id="cardGrid"></div>
  </main>

  <div id="siteSearch"></div>
  <div id="siteFab"></div>

  <script src="components/analytics.js"></script>
  <script src="components/voice.js"></script>
  <script src="components/fab.js"></script>
  <script src="components/transitions.js"></script>
  <script src="components/logo.js"></script>
  <script src="components/icons.js"></script>
  <script src="components/menu.js"></script>
  <script src="components/header.js"></script>
  <script src="components/card.js"></script>
  <script src="components/search-data.js"></script>
  <script src="components/search.js"></script>
  <script>
    var voiceText =
      'Toll, dass du hier bist! Das hier sind die Mathe-Übungen für Vorschulkinder. ' +
      'Tippe einfach auf eine Aufgabe und leg los!';

    new NKCardGrid(document.getElementById('cardGrid'), {
      cards: [
        {
          href: 'vorschule-zaehlen.html',
          label: '… Zählen bis 10',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="52" r="10" stroke="currentColor" stroke-width="3"/><circle cx="40" cy="76" r="10" stroke="currentColor" stroke-width="3"/><circle cx="64" cy="40" r="10" stroke="currentColor" stroke-width="3"/><circle cx="64" cy="64" r="10" stroke="currentColor" stroke-width="3"/><circle cx="64" cy="88" r="10" stroke="currentColor" stroke-width="3"/><circle cx="88" cy="52" r="10" stroke="currentColor" stroke-width="3"/><circle cx="88" cy="76" r="10" stroke="currentColor" stroke-width="3"/></svg>'
        },
        {
          href: 'vorschule-zaehlen-20.html',
          label: '… Zählen bis 20',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="44" r="8" stroke="currentColor" stroke-width="3"/><circle cx="28" cy="64" r="8" stroke="currentColor" stroke-width="3"/><circle cx="28" cy="84" r="8" stroke="currentColor" stroke-width="3"/><circle cx="52" cy="36" r="8" stroke="currentColor" stroke-width="3"/><circle cx="52" cy="56" r="8" stroke="currentColor" stroke-width="3"/><circle cx="52" cy="76" r="8" stroke="currentColor" stroke-width="3"/><circle cx="52" cy="96" r="8" stroke="currentColor" stroke-width="3"/><circle cx="76" cy="44" r="8" stroke="currentColor" stroke-width="3"/><circle cx="76" cy="64" r="8" stroke="currentColor" stroke-width="3"/><circle cx="76" cy="84" r="8" stroke="currentColor" stroke-width="3"/><circle cx="100" cy="36" r="8" stroke="currentColor" stroke-width="3"/><circle cx="100" cy="56" r="8" stroke="currentColor" stroke-width="3"/><circle cx="100" cy="76" r="8" stroke="currentColor" stroke-width="3"/><circle cx="100" cy="96" r="8" stroke="currentColor" stroke-width="3"/></svg>'
        }
      ]
    });

    new NKSearch(document.getElementById('siteSearch'), {
      items: NKSearchData,
    });

    var menu = new NKMenu(
      document.getElementById('siteMenu'),
      Object.assign({}, NKMenu.THEMES.mathematik, {
        activeHref: 'vorschule-mathe.html',
        headerEl: document.getElementById('siteHeader'),
        onItemClick: function(item) {
          if (item.href && item.href !== '#') window.location.href = item.href;
        }
      })
    );

    var header = new NKHeader(
      document.getElementById('siteHeader'),
      Object.assign({}, NKHeader.THEMES.mathematik, {
        mode: 'brand',
        subtitle: 'Clever lernen',
        homeHref: 'index.html',
        onMenuClick: function() { menu.toggle(); }
      })
    );

    var fab = new NKFab(document.getElementById('siteFab'), {
      mode: 'page',
      onSpeak: function() { NKVoice.speak(voiceText, function() { fab.done(); }); },
      onStop:  function() { NKVoice.stop(); },
    });
  </script>

</body>
</html>
