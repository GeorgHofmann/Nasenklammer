<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO -->
  <meta name="description" content="Mathe üben für Vorschulkinder – Zählen bis 10 und mehr. Kostenlose interaktive Übungen auf Nasenklammer.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://nasenklammer.de/vorschule-mathe.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="Nasenklammer">
  <meta property="og:title" content="Mathematik für Vorschulkinder – Nasenklammer">
  <meta property="og:description" content="Mathe üben für Vorschulkinder – Zählen bis 10 und mehr. Kostenlose interaktive Übungen auf Nasenklammer.">
  <meta property="og:url" content="https://nasenklammer.de/vorschule-mathe.html">
  <meta property="og:image" content="https://nasenklammer.de/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mathematik für Vorschulkinder – Nasenklammer">
  <meta name="twitter:description" content="Mathe üben für Vorschulkinder – Zählen bis 10 und mehr. Kostenlose interaktive Übungen auf Nasenklammer.">
  <meta name="twitter:image" content="https://nasenklammer.de/og-image.png">
  <!-- /SEO -->
  <title>Vorschulkind – Mathematik – Nasenklammer</title>
  <link rel="stylesheet" href="components/fonts.css">
  <link rel="stylesheet" href="components/transitions.css">
  <link rel="stylesheet" href="components/logo.css">
  <link rel="stylesheet" href="components/header.css">
  <link rel="stylesheet" href="components/menu.css">
  <link rel="stylesheet" href="components/card.css">
  <link rel="stylesheet" href="components/fab.css">
  <style>
    :root {
      --font-logo:    'Alcyone', 'Solway', Georgia, serif;
      --font-heading: 'Solway', Georgia, serif;
      --font-body:    'Noto Sans', Arial, sans-serif;

      --color-bg:      #fbd4b0;
      --color-accent:  #964f12;
      --nk-card-color: #964f12;
      --nk-fab-bg:     #f4a056;
      --nk-fab-color:  #00363d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Breadcrumb-Strip ────────────────────── */
    .gs-strip {
      background: var(--color-bg);
      padding: 21px 56px;
    }

    .gs-strip__text {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 400;
      line-height: 40px;
      color: var(--color-accent);
      white-space: nowrap;
    }

    .gs-strip__link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      cursor: pointer;
    }

    .gs-strip__link:hover {
      opacity: 0.75;
    }

    /* ── Übungs-Karten ───────────────────────── */
    .gs-main {
      flex: 1;
      padding: 48px 56px 160px;
    }

    /* ── Unterer Bereich: Suche + FAB ────────── */
    .gs-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 68px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, transparent, var(--color-bg) 40%);
      pointer-events: none;
    }

    .gs-search {
      width: 560px;
      height: 64px;
      background: #fde8d0;
      border-radius: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding-left: 10px;
      padding-right: 20px;
      pointer-events: auto;
    }

    .gs-search__icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 32px;
      background: #f4a056;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      transition: opacity 0.15s;
    }

    .gs-search__icon-btn:hover { opacity: 0.85; }

    .gs-search__icon-btn svg { width: 20px; height: 20px; }

    .gs-search__input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 28px;
      letter-spacing: 0.25px;
      color: #7a4420;
      outline: none;
    }

    .gs-search__input::placeholder { color: #7a4420; }


    @media (max-width: 900px) {
      .gs-strip   { padding: 16px 20px; }
      .gs-strip__text { font-size: 22px; white-space: normal; }
      .gs-main    { padding: 32px 20px 140px; }
      .gs-bottom  { padding: 16px 20px 24px; }
    }
  </style>
</head>
<body>

  <div id="siteMenu"></div>
  <header id="siteHeader"></header>

  <!-- Strip: Ich bin ein … und übe in Meine Welt … -->
  <div class="gs-strip">
    <p class="gs-strip__text">
      Ich bin ein
      <a class="gs-strip__link" href="vorschule.html">Vorschulkind</a>
      und übe in
      <a class="gs-strip__link" href="vorschule-meine-welt.html">Meine Welt</a>
      …
    </p>
  </div>

  <!-- Übungs-Karten -->
  <main class="gs-main">
    <div id="cardGrid"></div>
  </main>

  <!-- Suche + FAB -->
  <div class="gs-bottom">
    <div class="gs-search">
      <button class="gs-search__icon-btn" aria-label="Suchen">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <input class="gs-search__input" type="text" placeholder="Ich suche eine Übung …" aria-label="Übung suchen">
    </div>
  </div>

  <!-- FAB – mounted by NKFab component -->
  <div id="siteFab"></div>

  <script src="components/analytics.js"></script>
  <script src="components/voice.js"></script>
  <script src="components/fab.js"></script>
  <script src="components/transitions.js"></script>
  <script src="components/logo.js"></script>
  <script src="components/icons.js"></script>
  <script src="components/menu.js"></script>
  <script src="components/header.js"></script>
  <script src="components/card.js"></script>
  <script>
    var voiceText =
      'Toll, dass du hier bist! Das hier sind die Mathe-Übungen für Vorschulkinder. ' +
      'Tippe einfach auf eine Aufgabe und leg los!';

    new NKCardGrid(document.getElementById('cardGrid'), {
      cards: [
        {
          href: 'vorschule-zaehlen.html',
          label: '… Zählen bis 10',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="52" r="10" stroke="currentColor" stroke-width="3"/><circle cx="40" cy="76" r="10" stroke="currentColor" stroke-width="3"/><circle cx="64" cy="40" r="10" stroke="currentColor" stroke-width="3"/><circle cx="64" cy="64" r="10" stroke="currentColor" stroke-width="3"/><circle cx="64" cy="88" r="10" stroke="currentColor" stroke-width="3"/><circle cx="88" cy="52" r="10" stroke="currentColor" stroke-width="3"/><circle cx="88" cy="76" r="10" stroke="currentColor" stroke-width="3"/></svg>'
        }
      ]
    });

    var menu = new NKMenu(
      document.getElementById('siteMenu'),
      Object.assign({}, NKMenu.THEMES.mathematik, {
        activeHref: 'vorschule-mathe.html',
        headerEl: document.getElementById('siteHeader'),
        onItemClick: function(item) {
          if (item.href && item.href !== '#') window.location.href = item.href;
        }
      })
    );

    var header = new NKHeader(
      document.getElementById('siteHeader'),
      Object.assign({}, NKHeader.THEMES.mathematik, {
        mode: 'brand',
        subtitle: 'Clever lernen',
        homeHref: 'index.html',
        onMenuClick: function() { menu.toggle(); }
      })
    );

    var fab = new NKFab(document.getElementById('siteFab'), {
      mode: 'page',
      onSpeak: function() { NKVoice.speak(voiceText, function() { fab.done(); }); },
      onStop:  function() { NKVoice.stop(); },
    });
  </script>

</body>
</html>
