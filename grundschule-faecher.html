  <title>Grundschulkind – Fächer – Nasenklammer</title>

  <link rel="stylesheet" href="components/transitions.css">
  <link rel="stylesheet" href="components/logo.css">
  <link rel="stylesheet" href="components/header.css">
  <link rel="stylesheet" href="components/menu.css">
  <link rel="stylesheet" href="components/card.css">
  <link rel="stylesheet" href="components/search.css">
  <link rel="stylesheet" href="components/fab.css">
  <style>
    :root {
      --font-logo:    'Alcyone', 'Solway', Georgia, serif;
      --font-heading: 'Solway', Georgia, serif;
      --font-body:    'Noto Sans', Arial, sans-serif;

      --color-home-header:      #c8e0f4;
      --color-home-strip:       #75aee3;
      --color-home-accent:      #225a93;
      --color-home-search-bg:   #c8e0f4;
      --color-home-search-icon: #963555;
      --nk-fab-bg:              #f4a056;
      --nk-fab-color:           #00363d;
      --nk-search-panel-bg:   rgba(165,200,230,0.97);
      --nk-search-trigger-bg: rgba(200,224,244,0.62);
      --nk-search-icon-bg:    #963555;
      --nk-search-text:       #1a3a6c;
      --nk-search-placeholder:#5a7ea8;
      --nk-search-accent:     #225a93;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-home-strip);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Strip ───────────────────────────────── */
    .gs-strip {
      background: var(--color-home-strip);
      padding: 21px 56px;
    }
    .gs-strip__text {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 400;
      line-height: 40px;
      color: var(--color-home-accent);
      white-space: nowrap;
    }
    .gs-strip__link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      cursor: pointer;
    }
    .gs-strip__link:hover { opacity: 0.75; }

    /* ── Karten-Bereich ──────────────────────── */
    .gs-main {
      flex: 1;
      padding: 48px 56px 160px;
    }
    @media (max-width: 900px) {
      .gs-strip   { padding: 16px 20px; }
      .gs-strip__text { font-size: 22px; white-space: normal; }
      .gs-main    { padding: 32px 20px 140px; }
    }
  </style>
</head>
<body>

  <div id="siteMenu"></div>
  <header id="siteHeader"></header>

  <!-- Strip -->
  <div class="gs-strip">
    <p class="gs-strip__text">
      Ich bin ein
      <a class="gs-strip__link" href="index.html">Grundschulkind</a>
      und übe in …
    </p>
  </div>

  <!-- Fächer-Karten -->
  <main class="gs-main">
    <div id="cardGrid"></div>
  </main>

  <div id="siteSearch"></div>
  <div id="siteFab"></div>

  <script src="components/analytics.js"></script>
  <script src="components/voice.js"></script>
  <script src="components/fab.js"></script>
  <script src="components/transitions.js"></script>
  <script src="components/logo.js"></script>
  <script src="components/icons.js"></script>
  <script src="components/menu.js"></script>
  <script src="components/header.js"></script>
  <script src="components/card.js"></script>
  <script src="components/search-data.js"></script>
  <script src="components/search.js"></script>
  <script>
    var voiceText =
      'Welches Fach möchtest du heute üben? ' +
      'Im Moment ist Mathematik verfügbar. ' +
      'Tippe einfach auf das Fach, das dich interessiert!';

    new NKCardGrid(document.getElementById('cardGrid'), {
      cards: [
        {
          href: 'grundschule.html',
          label: 'Mathematik',
          imageSvg: [
            '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">',
            '  <circle cx="64" cy="64" r="36" stroke="currentColor" stroke-width="3"/>',
            '  <path d="M48 64h32M64 48v32" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>',
            '</svg>'
          ].join('')
        },
        {
          href: 'deutsch.html',
          label: 'Deutsch',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M64 40v48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M30 36h34v52H30V36z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M64 36h34v52H64V36z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M38 52h18M38 62h18M38 72h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M72 52h18M72 62h18M72 72h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>'
        },
        {
          href: '#', disabled: true,
          label: 'Sachkunde',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="64" cy="60" r="34" stroke="currentColor" stroke-width="3"/><path d="M64 26v68M30 60h68" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="64" cy="60" rx="14" ry="34" stroke="currentColor" stroke-width="2.5"/><path d="M35 44c9 4 19 6 29 6s20-2 29-6M35 76c9-4 19-6 29-6s20 2 29 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>'
        },
        {
          href: '#', disabled: true,
          label: 'Englisch',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 32h84v56H74l-18 20V88H22V32z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M40 52h48M40 64h48M40 76h30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>'
        }
      ]
    });

    new NKSearch(document.getElementById('siteSearch'), {
      items: NKSearchData,
    });

    var menu = new NKMenu(
      document.getElementById('siteMenu'),
      Object.assign({}, NKMenu.THEMES.home, {
        headerEl: document.getElementById('siteHeader'),
        activeHref: 'grundschule-faecher.html',
        onItemClick: function(item) {
          if (item.href && item.href !== '#') window.location.href = item.href;
        }
      })
    );

    var header = new NKHeader(
      document.getElementById('siteHeader'),
      Object.assign({}, NKHeader.THEMES.home, {
        homeHref: 'index.html',
        onMenuClick: function() { menu.toggle(); }
      })
    );

    var fab = new NKFab(document.getElementById('siteFab'), {
      mode: 'page',
      onSpeak: function() { NKVoice.speak(voiceText, function() { fab.done(); }); },
      onStop:  function() { NKVoice.stop(); },
    });
  </script>

</body>
</html>
