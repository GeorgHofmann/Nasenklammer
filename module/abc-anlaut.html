<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../components/fonts.css">
  <title>ABC – Anlaute</title>
  <style>
    :root {
      --bg:     #F5C8D4;
      --acc:    #963555;
      --al:     rgba(31,63,18,.13);
      --ok:     #2d7d2d;
      --err:    #c0392b;
      --fh:     'Solway', Georgia, serif;
      --fb:     'Noto Sans', Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--fb);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* ── Navigationsleiste ─────────────────── */
    .nav {
      display: flex;
      align-items: center;
      padding: 10px 16px 6px;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-btn {
      width: 40px; height: 40px;
      border: 2px solid var(--acc);
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      color: var(--acc);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 180ms, transform 120ms;
    }
    .nav-btn:hover:not(:disabled) { background: var(--al); }
    .nav-btn:active:not(:disabled) { transform: scale(.9); }
    .nav-btn:disabled { opacity: .2; cursor: default; pointer-events: none; }
    .nav-progress {
      flex: 1;
      text-align: center;
      font-family: var(--fh);
      font-size: 15px;
      color: var(--acc);
    }
    .nav-score {
      font-family: var(--fh);
      font-size: 15px;
      color: var(--acc);
      white-space: nowrap;
      min-width: 72px;
      text-align: right;
    }

    /* ── Spielfläche ───────────────────────── */
    .game {
      flex: 1;
      display: flex;
      gap: 10px;
      padding: 6px 16px 14px;
      min-height: 0;
    }

    /* Gegenstands-Spalte */
    .obj-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      min-width: 0;
    }
    .obj-card {
      background: white;
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      transition: transform 180ms, box-shadow 180ms;
      touch-action: none;
      border: 3px solid transparent;
      flex: 1;
      min-height: 72px;
    }
    .obj-card:hover { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(0,0,0,.13); }
    .obj-card.dragging { opacity: .28; transform: scale(.95); }
    .obj-card svg { width: 58px; height: 58px; flex-shrink: 0; }
    .obj-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--acc);
      flex: 1;
    }

    /* Buchstaben- und Abwurf-Spalte */
    .letter-col {
      width: 138px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .letter-wrap { text-align: center; line-height: 1; }
    .letter-big {
      font-family: var(--fh);
      font-size: 90px;
      font-weight: 700;
      color: var(--acc);
      display: block;
    }
    .letter-small {
      font-family: var(--fh);
      font-size: 46px;
      font-weight: 400;
      color: var(--acc);
      opacity: .5;
      display: block;
      margin-top: -6px;
    }
    .drop-zone {
      width: 118px;
      min-height: 82px;
      border: 3px dashed rgba(31,63,18,.38);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 8px;
      transition: background 180ms, border-color 180ms;
    }
    .drop-zone.over {
      background: var(--al);
      border-color: var(--acc);
      border-style: solid;
    }
    .drop-zone.ok-flash {
      background: rgba(45,125,45,.16);
      border-color: var(--ok);
      border-style: solid;
    }
    .drop-zone.err-flash {
      background: rgba(192,57,43,.1);
      border-color: var(--err);
      border-style: solid;
    }
    .drop-hint {
      font-size: 12px;
      color: rgba(31,63,18,.42);
      line-height: 1.45;
    }

    /* ── Drag-Ghost ────────────────────────── */
    .ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%) scale(1.06);
      background: white;
      border-radius: 14px;
      padding: 8px 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: .93;
    }
    .ghost svg   { width: 50px; height: 50px; }
    .ghost .obj-label { font-size: 14px; font-weight: 600; color: var(--acc); }

    /* ── Animationen ───────────────────────── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      18%      { transform: translateX(-10px); }
      36%      { transform: translateX(10px); }
      54%      { transform: translateX(-7px); }
      72%      { transform: translateX(7px); }
    }
    .shake { animation: shake 380ms ease-out; }

    @keyframes star-pop {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
      55%  { transform: translate(-50%,-100%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%,-150%) scale(1.2); opacity: 0; }
    }
    .star-pop {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      font-size: 38px;
      animation: star-pop 680ms ease-out forwards;
    }

    /* ── Abschlussbildschirm ───────────────── */
    .end-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 200;
    }
    .end-screen.visible { display: flex; }
    .end-emoji  { font-size: 56px; }
    .end-title  {
      font-family: var(--fh);
      font-size: 30px;
      color: var(--acc);
      text-align: center;
    }
    .end-score  {
      font-family: var(--fh);
      font-size: 20px;
      color: var(--acc);
    }
    .end-replay {
      background: var(--acc);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-family: var(--fh);
      border-radius: 12px;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 180ms;
    }
    .end-replay:hover { opacity: .86; }

    /* ── Responsive ────────────────────────── */
    @media (min-height: 620px) {
      .obj-card svg  { width: 70px; height: 70px; }
      .letter-big    { font-size: 104px; }
      .letter-small  { font-size: 52px; }
      .letter-col    { width: 150px; }
      .drop-zone     { width: 130px; min-height: 90px; }
    }
    @media (max-height: 480px) {
      .letter-big   { font-size: 64px; }
      .letter-small { font-size: 34px; }
      .nav          { padding: 6px 12px 4px; }
      .game         { padding: 4px 12px 10px; gap: 8px; }
    }

</head>

    </button>
  </div>

      </div>
      <div class="drop-zone" id="dropZone">
        <span class="drop-hint">Zieh den<br>richtigen<br>Gegenstand<br>hierhin</span>
      </div>
    </div>
  </div>

    <div class="end-score" id="endScore"></div>
    <button class="end-replay" id="btnReplay">Nochmal spielen</button>

  /* ══════════════════════════════════════════════
     SPIELZUSTAND
     ══════════════════════════════════════════════ */
  var state = { index: 0, score: 0, locked: false };
  var ghost    = null;
  var dragCard = null;

  /* DOM-Referenzen */
  var objCol    = document.getElementById('objCol');
  var lBig      = document.getElementById('lBig');
  var lSmall    = document.getElementById('lSmall');
  var dropZone  = document.getElementById('dropZone');
  var btnPrev   = document.getElementById('btnPrev');
  var btnNext   = document.getElementById('btnNext');
  var navProg   = document.getElementById('navProgress');
  var navScore  = document.getElementById('navScore');
  var endScreen = document.getElementById('endScreen');
  var endScore  = document.getElementById('endScore');
  var btnReplay = document.getElementById('btnReplay');

  /* ── Hilfsfunktionen ─────────────────────── */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ── Runde rendern ───────────────────────── */
  function render() {
    var item = ITEMS[state.index];

    /* Buchstabe */
    lBig.textContent   = item.letter;
    lSmall.textContent = item.letter.toLowerCase();

    /* Fortschritt + Punkte */
    navProg.textContent  = 'Buchstabe ' + (state.index + 1) + ' · ' + ITEMS.length;
    navScore.textContent = '⭐ ' + state.score;
    btnPrev.disabled = (state.index === 0);
    btnNext.disabled = (state.index === ITEMS.length - 1);

    /* Abwurfzone zurücksetzen */
    dropZone.className   = 'drop-zone';
    dropZone.innerHTML   = '<span class="drop-hint">Zieh den<br>richtigen<br>Gegenstand<br>hierhin</span>';

    /* Karten mischen und rendern */
    var distractors = shuffle(
      ITEMS.filter(function(it) { return it.id !== item.id; })
    ).slice(0, 2);
    var cards = shuffle([item].concat(distractors));

    objCol.innerHTML = '';
    cards.forEach(function(it) {
      var card = document.createElement('div');
      card.className    = 'obj-card';
      card.dataset.id   = it.id;
      card.innerHTML    = it.svg + '<span class="obj-label">' + it.word + '</span>';
      attachDrag(card);
      objCol.appendChild(card);
    });
  }

  /* ── Drag & Drop (Pointer Events) ─────────── */
  function attachDrag(card) {
    var itemId = card.dataset.id;

    card.addEventListener('pointerdown', function(e) {
      if (state.locked) return;
      e.preventDefault();
      card.setPointerCapture(e.pointerId);

      /* Ghost erstellen */
      ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.innerHTML = card.innerHTML;
      ghost.style.left = e.clientX + 'px';
      ghost.style.top  = e.clientY + 'px';
      document.body.appendChild(ghost);

      card.classList.add('dragging');
      dragCard = card;
    });

    card.addEventListener('pointermove', function(e) {
      if (!ghost || dragCard !== card) return;
      ghost.style.left = e.clientX + 'px';
      ghost.style.top  = e.clientY + 'px';

      var dz   = dropZone.getBoundingClientRect();
      var over = (e.clientX > dz.left && e.clientX < dz.right &&
                  e.clientY > dz.top  && e.clientY < dz.bottom);
      dropZone.classList.toggle('over', over);
    });

    card.addEventListener('pointerup', function(e) {
      if (!ghost || dragCard !== card) return;
      var dz     = dropZone.getBoundingClientRect();
      var overDZ = (e.clientX > dz.left && e.clientX < dz.right &&
                    e.clientY > dz.top  && e.clientY < dz.bottom);
      var cx = e.clientX;
      var cy = e.clientY;
      endDrag();
      if (overDZ) handleDrop(itemId, card, cx, cy);
    });

    card.addEventListener('pointercancel', function() {
      if (dragCard === card) endDrag();
    });
  }

  function endDrag() {
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    ghost = null;
    if (dragCard) { dragCard.classList.remove('dragging'); dragCard = null; }
    dropZone.classList.remove('over');
  }

  /* ── Abwurf auswerten ────────────────────── */
  function handleDrop(itemId, card, cx, cy) {
    if (state.locked) return;

    var correct = (ITEMS[state.index].id === itemId);

    if (correct) {
      state.locked = true;
      state.score += 10;
      navScore.textContent = '⭐ ' + state.score;
      dropZone.classList.add('ok-flash');

      /* Stern-Animation */
      var star = document.createElement('div');
      star.className   = 'star-pop';
      star.textContent = '⭐';
      star.style.left  = cx + 'px';
      star.style.top   = cy + 'px';
      document.body.appendChild(star);
      setTimeout(function() { if (star.parentNode) star.parentNode.removeChild(star); }, 700);

      /* Weiter oder Abschluss */
      setTimeout(function() {
        state.locked = false;
        if (state.index < ITEMS.length - 1) {
          state.index++;
          render();
        } else {
          showEnd();
        }
      }, 900);

    } else {
      /* Schütteln + kurze Fehlermeldung */
      card.classList.add('shake');
      dropZone.classList.add('err-flash');
      setTimeout(function() {
        card.classList.remove('shake');
        dropZone.classList.remove('err-flash');
        dropZone.className = 'drop-zone';
        dropZone.innerHTML = '<span class="drop-hint">Zieh den<br>richtigen<br>Gegenstand<br>hierhin</span>';
      }, 500);
    }
  }

  /* ── Abschlussbildschirm ─────────────────── */
  function showEnd() {
    var pct   = state.score / (ITEMS.length * 10);
    var emoji = pct >= .9 ? '🌟' : pct >= .6 ? '😊' : '👍';
    var stars = pct >= .9 ? '⭐⭐⭐' : pct >= .6 ? '⭐⭐' : '⭐';
    document.querySelector('.end-emoji').textContent = emoji;
    endScore.textContent = stars + '  ' + state.score + ' Punkte';
    endScreen.classList.add('visible');
  }

  /* ── Navigation ──────────────────────────── */
  btnPrev.addEventListener('click', function() {
    if (!state.locked && state.index > 0) { state.index--; render(); }
  });

  btnNext.addEventListener('click', function() {
    if (!state.locked && state.index < ITEMS.length - 1) { state.index++; render(); }
  });

  btnReplay.addEventListener('click', function() {
    state.index  = 0;
    state.score  = 0;
    state.locked = false;
    endScreen.classList.remove('visible');
    render();
  });

  /* ── Start ───────────────────────────────── */
  render();
  </script>
