<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Monster und Höhle</title>
  <link rel="stylesheet" href="../components/count-display.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #f4efe8;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas { display: block; }

    #counter-wrap {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dot {
      width: 24px;
      height: 4px;
      border-radius: 2px;
      background: #3d6e27;
      opacity: 0.5;
      transition: opacity 0.3s;
    }
    .dot.filled { opacity: 1; }

    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.88rem;
      color: #b0a0b8;
      pointer-events: none;
      z-index: 10;
    }

    /* ── Zzz-Schläfer-Animation ─────────────── */
    #zzz {
      position: fixed;
      pointer-events: none;
      z-index: 10;
      display: none;
      white-space: nowrap;
      transform: translateX(-50%);
    }
    #zzz span {
      display: inline-block;
      font-weight: 900;
      color: #9a7ab8;
      opacity: 0;
      animation: floatZ 2.8s ease-in-out infinite;
    }
    #zzz span:nth-child(1) { font-size: 0.85rem; animation-delay: 0.0s; }
    #zzz span:nth-child(2) { font-size: 1.05rem; animation-delay: 0.35s; }
    #zzz span:nth-child(3) { font-size: 1.30rem; animation-delay: 0.70s; }
    #zzz span:nth-child(4) { font-size: 1.05rem; animation-delay: 1.05s; }
    #zzz span:nth-child(5) { font-size: 0.90rem; animation-delay: 1.40s; }
    #zzz span:nth-child(6) { font-size: 0.80rem; animation-delay: 1.75s; }
    #zzz span:nth-child(7) { font-size: 0.85rem; animation-delay: 2.10s; }

    @keyframes floatZ {
      0%   { opacity: 0;   transform: translateY(0px)   translateX(0px);  }
      18%  { opacity: 0.9;                                                  }
      80%  { opacity: 0.5;                                                  }
      100% { opacity: 0;   transform: translateY(-38px) translateX(6px);   }
    }

    /* ── Erfolgs-Screen ─────────────────────── */
    #success {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(248,244,252,0.97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }
    #success.show { opacity: 1; pointer-events: all; }
    #success-star {
      font-size: 5rem;
      margin-bottom: 10px;
      animation: floatStar 1.4s ease-in-out infinite alternate;
    }
    @keyframes floatStar {
      from { transform: translateY(0) rotate(-4deg); }
      to   { transform: translateY(-14px) rotate(4deg); }
    }
    #success-title { font-size: 2.4rem; font-weight: 900; color: #4a3a58; margin-bottom: 6px; }
    #success-sub   { font-size: 1.0rem; color: #9a8aaa; margin-bottom: 36px; }
    #restart-btn {
      background: linear-gradient(135deg, #d4a8d4, #a8c4e0);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 52px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(180,150,210,0.4);
      transition: transform 0.12s;
    }
    #restart-btn:hover  { transform: scale(1.04); }
    #restart-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div id="counter-wrap">
  <div id="counter"></div>
  <div id="dots">
  <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
  <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  <div class="dot" id="d4"></div><div class="dot" id="d5"></div>
  <div class="dot" id="d6"></div><div class="dot" id="d7"></div>
  <div class="dot" id="d8"></div><div class="dot" id="d9"></div>
</div>
</div>

<div id="hint">Tippe auf ein Monster ✦</div>

<!-- Zzz-Animation über der Höhle -->
<div id="zzz">
  <span>z</span><span>z</span><span>z</span><span>z</span>
  <span>h</span><span>h</span><span>h</span>
</div>

<div id="success">
  <div id="success-star">🌟</div>
  <div id="success-title">Geschafft! 10 / 10</div>
  <div id="success-sub">Alle Monster schlafen jetzt in der Höhle!</div>
  <button id="restart-btn" onclick="restartGame()">Nochmal spielen ↩</button>
</div>

<script src="../components/count-display.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── RENDERER ─────────────────────────────
var scene    = new THREE.Scene();
scene.background = new THREE.Color(0xf4efe8);
scene.fog    = new THREE.Fog(0xf4efe8, 24, 38);

var camera   = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(0, 8, 17);
camera.lookAt(new THREE.Vector3(0, 0, 0));

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateZzzPos();
});

// ── LIGHTS ───────────────────────────────
// Ambient niedrig → Toon-Schritt bleibt sichtbar, kein Ausblenden
var ambient = new THREE.AmbientLight(0xffffff, 0.70);
scene.add(ambient);

// Etwas stärkeres Direktlicht → klare Licht/Schatten-Kante auf den Kugeln
var sun = new THREE.DirectionalLight(0xfff8f0, 0.52);
sun.position.set(6, 14, 9);
sun.castShadow = true;
sun.shadow.mapSize.width  = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left   = -12;
sun.shadow.camera.right  =  12;
sun.shadow.camera.top    =  12;
sun.shadow.camera.bottom = -12;
sun.shadow.camera.near   =   1;
sun.shadow.camera.far    =  40;
sun.shadow.bias = -0.001;
scene.add(sun);
// Kein Fill-Licht mehr nötig

// (kein Boden – Blob-Schatten wird nach buildCave gesetzt)

// ── CAVE ─────────────────────────────────
var CAVE_POS   = new THREE.Vector3(0, 0, -4.0);
var CAVE_RZONE = 2.0;

function buildCave() {
  var g = new THREE.Group();

  var rockMat  = new THREE.MeshLambertMaterial({ color: 0x8c8070 });
  var rock2Mat = new THREE.MeshLambertMaterial({ color: 0x9a8e80 });
  var darkMat  = new THREE.MeshLambertMaterial({ color: 0x110c18 });
  var floorMat = new THREE.MeshLambertMaterial({ color: 0x342c3e });

  var back = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.8), darkMat);
  back.position.set(0, 0.30, -0.62);
  g.add(back);

  var cf = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 1.3), floorMat);
  cf.rotation.x = -Math.PI / 2;
  cf.position.set(0, -0.91, -0.25);
  g.add(cf);

  var lp = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.60, 2.9, 12), rockMat);
  lp.position.set(-1.35, 0.35, 0);
  lp.castShadow = true; lp.receiveShadow = true;
  g.add(lp);

  var rp = lp.clone();
  rp.position.set(1.35, 0.35, 0);
  g.add(rp);

  var arch = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.50, 10, 28, Math.PI), rockMat);
  arch.position.set(0, 1.80, 0);
  arch.castShadow = true;
  g.add(arch);

  var topRock = new THREE.Mesh(new THREE.SphereGeometry(1.05, 12, 12), rock2Mat);
  topRock.scale.set(1.8, 0.9, 0.8);
  topRock.position.set(0, 2.50, -0.1);
  topRock.castShadow = true;
  g.add(topRock);

  var pebPos = [[-2.0,-0.60,0.30],[2.0,-0.70,0.30],[-1.5,-0.75,0.65],[1.5,-0.72,0.72],[0.0,-0.80,0.82]];
  for (var pi = 0; pi < pebPos.length; pi++) {
    var p = pebPos[pi];
    var peb = new THREE.Mesh(new THREE.SphereGeometry(0.28+Math.random()*0.12, 9, 9), rockMat);
    peb.position.set(p[0], p[1], p[2]);
    peb.scale.y = 0.65;
    peb.castShadow = true;
    g.add(peb);
  }

  var sparkMat = new THREE.MeshBasicMaterial({ color: 0xecd8f0 });
  var sparkPos = [[-1.0,2.0,0.3],[0.6,2.2,0.3],[-0.3,2.4,0.2],[1.1,1.7,0.4]];
  for (var si = 0; si < sparkPos.length; si++) {
    var sp = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), sparkMat);
    sp.position.set(sparkPos[si][0], sparkPos[si][1], sparkPos[si][2]);
    g.add(sp);
  }

  g.position.copy(CAVE_POS);
  return g;
}

scene.add(buildCave());

// ── BLOB-SCHATTEN unter der Höhle (Cartoon-Stil) ──────
var caveShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.9, 40),
  new THREE.MeshBasicMaterial({ color: 0xa89888, transparent: true, opacity: 0.42 })
);
caveShadow.rotation.x = -Math.PI / 2;
caveShadow.scale.set(1.35, 0.72, 1.0);   // breiter als tief → ovaler Abdruck
caveShadow.position.set(CAVE_POS.x, -0.87, CAVE_POS.z + 0.10);
scene.add(caveShadow);

// Cave slots (world space)
var SLOTS = [];
var sx = [-1.0, -0.5, 0.0, 0.5, 1.0];
for (var row = 0; row < 2; row++) {
  for (var col = 0; col < 5; col++) {
    SLOTS.push({
      pos: new THREE.Vector3(CAVE_POS.x + sx[col], CAVE_POS.y + 0.18 - row * 0.52, CAVE_POS.z - 0.45 - row * 0.08),
      occupied: false
    });
  }
}

// ── SHARED MATS ──────────────────────────
// MeshToonMaterial = Cel-Shading: flache Farbflächen, kein Glanzlicht
var DARK_MAT  = new THREE.MeshToonMaterial({ color: 0x28183a });
var WHITE_MAT = new THREE.MeshToonMaterial({ color: 0xffffff });

function cMat(hex) { return new THREE.MeshToonMaterial({ color: hex }); }

// ── MONSTER PARTS ────────────────────────
function addEyes(g) {
  [-0.19, 0.19].forEach(function(x) {
    var ew = new THREE.Mesh(new THREE.SphereGeometry(0.135, 12, 12), WHITE_MAT);
    ew.position.set(x, 0.16, 0.43);
    g.add(ew);
    var pu = new THREE.Mesh(new THREE.SphereGeometry(0.073, 10, 10), DARK_MAT);
    pu.position.set(x, 0.16, 0.515);
    g.add(pu);
    var sh = new THREE.Mesh(new THREE.SphereGeometry(0.033, 8, 8), WHITE_MAT);
    sh.position.set(x + 0.046, 0.200, 0.550);
    g.add(sh);
  });
}

function addSmile(g) {
  var sm = new THREE.Mesh(
    new THREE.TorusGeometry(0.092, 0.023, 8, 16, Math.PI),
    DARK_MAT
  );
  sm.position.set(0, -0.068, 0.458);
  sm.rotation.z = Math.PI;
  g.add(sm);
}

function addLegs(g, bMat) {
  [-0.20, 0.20].forEach(function(x) {
    var leg = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 10), bMat);
    leg.position.set(x, -0.54, 0.08);
    leg.castShadow = true;
    g.add(leg);
  });
}

var ARM_REST_L =  Math.PI / 3.6;
var ARM_REST_R = -Math.PI / 3.6;

function addArms(g, bMat) {
  var armGeo = new THREE.CylinderGeometry(0.088, 0.072, 0.44, 8);

  var la = new THREE.Mesh(armGeo, bMat);
  la.position.set(-0.56, 0.02, 0.08);
  la.rotation.z = ARM_REST_L;
  la.castShadow = true;
  g.add(la);

  var ra = new THREE.Mesh(armGeo, bMat);
  ra.position.set(0.56, 0.02, 0.08);
  ra.rotation.z = ARM_REST_R;
  ra.castShadow = true;
  g.add(ra);

  return { la: la, ra: ra };
}

// ── FEATURES ─────────────────────────────
function fCatEars(g, bMat) {
  var innerMat = cMat(0xffabc4);
  [-0.23, 0.23].forEach(function(x) {
    var ear = new THREE.Mesh(new THREE.ConeGeometry(0.145, 0.32, 8), bMat);
    ear.position.set(x, 0.67, 0.07);
    g.add(ear);
    var inn = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.22, 8), innerMat);
    inn.position.set(x, 0.67, 0.14);
    g.add(inn);
  });
}

function fBunnyEars(g, bMat) {
  var innerMat = cMat(0xe8c0dc);
  [-0.17, 0.17].forEach(function(x) {
    var ear = new THREE.Mesh(new THREE.CylinderGeometry(0.078, 0.105, 0.58, 8), bMat);
    ear.position.set(x, 0.90, 0.04);
    ear.rotation.z = x < 0 ? 0.17 : -0.17;
    g.add(ear);
    var inn = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.056, 0.44, 8), innerMat);
    inn.position.set(x, 0.90, 0.10);
    inn.rotation.z = x < 0 ? 0.17 : -0.17;
    g.add(inn);
  });
}

function fBow(g, bMat) {
  var bwMat = cMat(0xff9ab8);
  [-1, 1].forEach(function(s) {
    var petal = new THREE.Mesh(new THREE.SphereGeometry(0.155, 8, 8), bwMat);
    petal.scale.set(0.55, 0.88, 0.38);
    petal.position.set(s * 0.17, 0.63, 0.14);
    g.add(petal);
  });
  var ctr = new THREE.Mesh(new THREE.SphereGeometry(0.072, 8, 8), bwMat);
  ctr.position.set(0, 0.63, 0.19);
  g.add(ctr);
}

function fSmallHorns(g, bMat) {
  [-0.19, 0.19].forEach(function(x) {
    var h = new THREE.Mesh(new THREE.ConeGeometry(0.082, 0.26, 8), bMat);
    h.position.set(x, 0.62, 0.07);
    g.add(h);
  });
}

function fWings(g, bMat) {
  var wMat = cMat(0xf8d2dc);
  wMat.side = THREE.DoubleSide;
  [-1, 1].forEach(function(s) {
    var w = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), wMat);
    w.scale.set(0.33, 0.72, 0.12);
    w.position.set(s * 0.74, 0.14, -0.12);
    w.rotation.y = s * 0.55;
    g.add(w);
  });
}

function fSingleHorn(g, bMat) {
  var hMat = cMat(0xbcd0f0);
  var h = new THREE.Mesh(new THREE.ConeGeometry(0.105, 0.42, 8), hMat);
  h.position.set(0, 0.70, 0.09);
  g.add(h);
}

function fSpikes(g, bMat) {
  [-0.21, 0, 0.21].forEach(function(x, i) {
    var sp = new THREE.Mesh(new THREE.ConeGeometry(0.072, 0.26, 6), bMat);
    sp.position.set(x, 0.60 + (i === 1 ? 0.09 : 0), 0.06);
    g.add(sp);
  });
}

function fRoundNose(g, bMat) {
  var nMat = cMat(0xd48060);
  var n = new THREE.Mesh(new THREE.SphereGeometry(0.105, 10, 10), nMat);
  n.position.set(0, -0.05, 0.535);
  g.add(n);
}

function fAntenna(g, bMat) {
  var aMat = cMat(0x9898c0);
  var stick = new THREE.Mesh(new THREE.CylinderGeometry(0.027, 0.027, 0.44, 8), aMat);
  stick.position.set(0, 0.74, 0.05);
  g.add(stick);
  var ball = new THREE.Mesh(new THREE.SphereGeometry(0.096, 10, 10), aMat);
  ball.position.set(0, 1.0, 0.05);
  g.add(ball);
}

function fPointyEars(g, bMat) {
  [-0.41, 0.41].forEach(function(x) {
    var e = new THREE.Mesh(new THREE.ConeGeometry(0.125, 0.34, 6), bMat);
    e.position.set(x, 0.44, 0.04);
    e.rotation.z = x < 0 ? 0.46 : -0.46;
    g.add(e);
  });
}

// ── MONSTER FACTORY ──────────────────────
var DEFS = [
  [0xd94f7a, fCatEars,    'Rosie' ],   // kräftiges Pink
  [0x7c56cc, fBunnyEars,  'Lila'  ],   // satte Pflaume
  [0x3aaa82, fBow,        'Minni' ],   // tiefes Mintgrün
  [0xe08830, fSmallHorns, 'Crema' ],   // warmes Bernstein
  [0xc04860, fWings,      'Dusti' ],   // kräftiges Korallrot
  [0x3a7ec0, fSingleHorn, 'Blu'   ],   // mittleres Blau
  [0x5e9448, fSpikes,     'Sage'  ],   // sattes Laubgrün
  [0xe06820, fRoundNose,  'Ori'   ],   // leuchtendes Orange
  [0x7a5aaa, fAntenna,    'Grisu' ],   // mittleres Lavendel
  [0xd4a800, fPointyEars, 'Yello' ],   // goldenes Gelb
];

function buildMonster(def) {
  var g    = new THREE.Group();
  var bMat = cMat(def[0]);

  var body = new THREE.Mesh(new THREE.SphereGeometry(0.50, 20, 20), bMat);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  addEyes(g);
  addSmile(g);
  addLegs(g, bMat);
  var arms = addArms(g, bMat);
  def[1](g, bMat);

  g.userData = {
    name:     def[2],
    isInCave: false,
    isFlying: false,
    slotIdx:  -1,
    homePos:  new THREE.Vector3(),
    flyStart: new THREE.Vector3(),
    flyEnd:   new THREE.Vector3(),
    flyT:     0,
    arms:     arms,
    tL:       ARM_REST_L,
    tR:       ARM_REST_R,
    popAnim:  0,
  };
  return g;
}

// Home grid
var HOME_POS = [];
for (var row = 0; row < 2; row++) {
  for (var col = 0; col < 5; col++) {
    HOME_POS.push(new THREE.Vector3(-4 + col * 2, 0, 3.5 + row * 3.2));
  }
}

var MONSTERS = DEFS.map(function(def, i) {
  var m = buildMonster(def);
  m.position.copy(HOME_POS[i]);
  m.userData.homePos.copy(HOME_POS[i]);
  scene.add(m);
  return m;
});

// ── CLICK / TAP ──────────────────────────
var raycaster = new THREE.Raycaster();

function ndc(e) {
  var rect = renderer.domElement.getBoundingClientRect();
  var src  = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
  return new THREE.Vector2(
    ((src.clientX - rect.left) / rect.width)  *  2 - 1,
    ((src.clientY - rect.top)  / rect.height) * -2 + 1
  );
}

function sendToCave(monster) {
  var ud = monster.userData;
  if (ud.isInCave || ud.isFlying) return;

  var slot = null, slotIdx = -1;
  for (var si = 0; si < SLOTS.length; si++) {
    if (!SLOTS[si].occupied) { slot = SLOTS[si]; slotIdx = si; break; }
  }
  if (!slot) return;

  SLOTS[slotIdx].occupied = true;
  ud.slotIdx  = slotIdx;
  ud.flyStart.copy(monster.position);
  ud.flyEnd.copy(slot.pos);
  ud.flyT     = 0;
  ud.isFlying = true;
  ud.tL = -Math.PI / 2.4;
  ud.tR =  Math.PI / 2.4;
}

function sendHome(monster) {
  var ud = monster.userData;
  if (!ud.isInCave) return;
  ud.isInCave = false;
  ud.isFlying = false;
  if (ud.slotIdx >= 0) { SLOTS[ud.slotIdx].occupied = false; ud.slotIdx = -1; }
  monster.scale.setScalar(1.0);
  monster.rotation.y = 0;
  monster.position.copy(ud.homePos);
  monster.position.y = 0;
  ud.tL = ARM_REST_L;
  ud.tR = ARM_REST_R;
  decrement();
}

// Tap detection: track start pos to ignore scrolls
var ptrDownPos = null;
var TAP_MAX_DIST = 12;

var cvs = renderer.domElement;

cvs.addEventListener('pointerdown', function(e) {
  ptrDownPos = { x: e.clientX, y: e.clientY };
});

cvs.addEventListener('pointerup', function(e) {
  if (!ptrDownPos) return;
  var dx = e.clientX - ptrDownPos.x;
  var dy = e.clientY - ptrDownPos.y;
  ptrDownPos = null;
  if (Math.sqrt(dx*dx + dy*dy) > TAP_MAX_DIST) return;  // was a scroll, not a tap

  var v = ndc(e);
  raycaster.setFromCamera(v, camera);
  var hits = raycaster.intersectObjects(MONSTERS, true);
  if (!hits.length) return;

  var obj = hits[0].object;
  while (obj.parent && obj.parent !== scene) obj = obj.parent;

  if (obj.userData.isInCave) {
    sendHome(obj);           // Tap on cave monster → zurück nach Hause
  } else {
    sendToCave(obj);         // Tap on free monster → zur Höhle fliegen
  }
});

// ── COUNTER & ZZZ ────────────────────────
var count   = 0;
var countDisplay = new NKCountDisplay(document.getElementById('counter'), { value: 0, total: 10 });
var sucEl   = document.getElementById('success');
var zzzEl   = document.getElementById('zzz');
var dotEls  = [];
for (var di = 0; di < 10; di++) dotEls.push(document.getElementById('d' + di));

// Position the zzz element above the cave (projected to screen)
var caveTopWorld = new THREE.Vector3(CAVE_POS.x, CAVE_POS.y + 3.6, CAVE_POS.z);

function updateZzzPos() {
  var v = caveTopWorld.clone().project(camera);
  var sx = (v.x + 1) / 2 * window.innerWidth;
  var sy = (1 - (v.y + 1) / 2) * window.innerHeight;
  zzzEl.style.left = sx + 'px';
  zzzEl.style.top  = sy + 'px';
}
updateZzzPos();

function showZzz() {
  zzzEl.style.display = count >= 1 ? 'block' : 'none';
}

function updateDots() {
  for (var i = 0; i < dotEls.length; i++) {
    if (i < count) dotEls[i].classList.add('filled');
    else           dotEls[i].classList.remove('filled');
  }
}

function increment() {
  count = Math.min(10, count + 1);
  countDisplay.set(count);
  updateDots(); showZzz();
  if (count >= 10) setTimeout(function() { sucEl.classList.add('show'); }, 700);
}

function decrement() {
  count = Math.max(0, count - 1);
  countDisplay.set(count);
  updateDots(); showZzz();
  sucEl.classList.remove('show');
}

function restartGame() {
  count = 0;
  countDisplay.set(0);
  updateDots(); showZzz();
  sucEl.classList.remove('show');
  for (var si = 0; si < SLOTS.length; si++) SLOTS[si].occupied = false;
  for (var mi = 0; mi < MONSTERS.length; mi++) {
    var m  = MONSTERS[mi];
    var ud = m.userData;
    ud.isInCave = false;
    ud.isFlying = false;
    ud.flyT     = 0;
    ud.slotIdx  = -1;
    ud.popAnim  = 0;
    ud.tL = ARM_REST_L;
    ud.tR = ARM_REST_R;
    m.scale.setScalar(1.0);
    m.rotation.y = 0;
    m.position.copy(ud.homePos);
    m.position.y = 0;
  }
}
window.restartGame = restartGame;

// ── ANIMATE ──────────────────────────────
var clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();

  for (var i = 0; i < MONSTERS.length; i++) {
    var m  = MONSTERS[i];
    var ud = m.userData;

    // ── Flug-Animation ──────────────────
    if (ud.isFlying) {
      ud.flyT += 0.028;   // ~36 Frames = ~0.6 Sekunden
      var ft   = Math.min(ud.flyT, 1.0);
      // Ease-in-out cubic
      var ease = ft < 0.5 ? 4*ft*ft*ft : 1 - Math.pow(-2*ft+2, 3) / 2;

      m.position.lerpVectors(ud.flyStart, ud.flyEnd, ease);
      m.position.y += Math.sin(ft * Math.PI) * 2.6;   // Bogen nach oben
      m.scale.setScalar(1.0 + (0.46 - 1.0) * ease);  // schrumpft beim Landen
      m.rotation.y = ft * Math.PI * 1.5;              // dreht sich beim Fliegen

      if (ft >= 1.0) {
        ud.isFlying = false;
        ud.isInCave = true;
        m.position.copy(ud.flyEnd);
        m.scale.setScalar(0.46);
        m.rotation.y = 0;
        ud.popAnim = 1;
        ud.tL = ARM_REST_L;
        ud.tR = ARM_REST_R;
        increment();
      }
      continue;  // keine Idle-Animation während des Flugs
    }

    // ── Idle-Wippe (nur freie Monster) ──
    if (!ud.isInCave) {
      m.position.y = Math.sin(t * 1.15 + i * 0.82) * 0.09;
      m.rotation.y = Math.sin(t * 0.78 + i * 1.08) * 0.12;
    }

    // ── Pop-Animation beim Landen ───────
    if (ud.popAnim > 0) {
      ud.popAnim -= 0.07;
      if (ud.popAnim < 0) ud.popAnim = 0;
      m.scale.setScalar(0.46 + Math.sin(ud.popAnim * Math.PI) * 0.16);
    }

    // ── Arm-Interpolation ───────────────
    var arms = ud.arms;
    arms.la.rotation.z += (ud.tL - arms.la.rotation.z) * 0.14;
    arms.ra.rotation.z += (ud.tR - arms.ra.rotation.z) * 0.14;
  }

  renderer.render(scene, camera);
}

animate();
</script>
