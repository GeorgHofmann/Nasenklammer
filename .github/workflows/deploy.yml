name: Deploy to 1&1

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: SFTP Deploy
        run: |
          lftp -u "${{ secrets.YOUR_USERNAME }}","${{ secrets.YOUR_PASSWORD }}" sftp://${{ secrets.YOUR_HOST }} <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror -R \
            --exclude=.git/ \
            --exclude=.github/ \
            --exclude=.claude/ \
            ./ /ablnkr/
          quit
          EOF
