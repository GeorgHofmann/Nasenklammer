<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta property="og:url" content="https://nasenklammer.de/vorschule.html">
  <meta property="og:image" content="https://nasenklammer.de/og-image.png">

  <title>Vorschulkind – Nasenklammer</title>
  <link rel="stylesheet" href="components/fonts.css">
  <link rel="stylesheet" href="components/transitions.css">
  <link rel="stylesheet" href="components/logo.css">
  <link rel="stylesheet" href="components/header.css">
  <link rel="stylesheet" href="components/menu.css">
  <link rel="stylesheet" href="components/card.css">
  <link rel="stylesheet" href="components/search.css">
  <link rel="stylesheet" href="components/fab.css">
  <style>
    :root {
      --font-logo:    'Alcyone', 'Solway', Georgia, serif;
      --font-heading: 'Solway', Georgia, serif;
      --font-body:    'Noto Sans', Arial, sans-serif;

      --color-home-header:      #c8e0f4;
      --color-home-strip:       #75aee3;
      --color-home-accent:      #225a93;
      --color-home-search-bg:   #c8e0f4;
      --color-home-search-icon: #963555;
      --color-home-fab:         #f4a056;
      --color-home-fab-text:    #00363d;
      --nk-fab-bg:              #f4a056;
      --nk-fab-color:           #00363d;
      --nk-search-panel-bg:   rgba(165,200,230,0.97);
      --nk-search-trigger-bg: rgba(200,224,244,0.62);
      --nk-search-icon-bg:    #963555;
      --nk-search-text:       #1a3a6c;
      --nk-search-placeholder:#5a7ea8;
      --nk-search-accent:     #225a93;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-home-strip);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Breadcrumb-Strip ────────────────────── */
    .gs-strip {
      background: var(--color-home-strip);
      padding: 21px 56px;
    }

    .gs-strip__text {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 400;
      line-height: 40px;
      color: var(--color-home-accent);
      white-space: nowrap;
    }

    .gs-strip__link {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      cursor: pointer;
    }

    .gs-strip__link:hover {
      opacity: 0.75;
    }

    /* ── Übungs-Karten ───────────────────────── */
    .gs-main {
      flex: 1;
      padding: 48px 56px 160px;
    }

    .gs-soon {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 400;
      color: var(--color-home-accent);
      opacity: 0.55;
    }

    @media (max-width: 900px) {
      .gs-strip   { padding: 16px 20px; }
      .gs-strip__text { font-size: 22px; white-space: normal; }
      .gs-main    { padding: 32px 20px 140px; }
    }
  </style>
</head>
<body>

  <div id="siteMenu"></div>
  <header id="siteHeader"></header>

  <!-- Strip: Ich bin ein … -->
  <div class="gs-strip">
    <p class="gs-strip__text">
      Ich bin ein
      <a class="gs-strip__link" href="index.html">Vorschulkind</a>
      und übe …
    </p>
  </div>

  <!-- Übungs-Karten -->
  <main class="gs-main">
    <div id="cardGrid"></div>
  </main>

  <div id="siteSearch"></div>
  <div id="siteFab"></div>

  <script src="components/analytics.js"></script>
  <script src="components/voice.js"></script>
  <script src="components/fab.js"></script>
  <script src="components/transitions.js"></script>
  <script src="components/logo.js"></script>
  <script src="components/icons.js"></script>
  <script src="components/menu.js"></script>
  <script src="components/header.js"></script>
  <script src="components/card.js"></script>
  <script src="components/search-data.js"></script>
  <script src="components/search.js"></script>
  <script>
    /* ─── Vorlese-Text ───────────────────────
       Beschreibt die Vorschul-Übersicht.
       ───────────────────────────────────────── */
    var voiceText =
      'Hallo, du kleines Schlaukind! Was möchtest du heute entdecken? ' +
      'Im Moment kannst du schon Meine Welt erkunden. Tippe einfach drauf!';

    new NKCardGrid(document.getElementById('cardGrid'), {
      cards: [
        {
          href: 'vorschule-mathe.html',
          label: 'Meine Welt',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="76" y="26" width="12" height="22" rx="2" stroke="currentColor" stroke-width="2.5"/><path d="M18 66L64 24l46 42" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 66v36h68V66" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><rect x="50" y="78" width="28" height="24" rx="3" stroke="currentColor" stroke-width="2.5"/><rect x="36" y="70" width="16" height="14" rx="2" stroke="currentColor" stroke-width="2"/></svg>'
        },
        {
          href: '#', disabled: true,
          label: 'Logik & Reihenfolgen',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="76" width="28" height="24" rx="4" stroke="currentColor" stroke-width="3"/><rect x="50" y="56" width="28" height="44" rx="4" stroke="currentColor" stroke-width="3"/><rect x="84" y="36" width="28" height="64" rx="4" stroke="currentColor" stroke-width="3"/><path d="M16 108h96" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="30" cy="88" r="5" fill="currentColor"/><circle cx="60" cy="74" r="5" fill="currentColor"/><circle cx="94" cy="58" r="5" fill="currentColor"/></svg>'
        },
        {
          href: '#', disabled: true,
          label: 'Ich und mein Körper',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="64" cy="32" r="18" stroke="currentColor" stroke-width="3"/><path d="M64 50v34" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M64 62L42 76M64 62L86 76" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M64 84L50 106M64 84L78 106" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M56 66c0-4.5 3.5-6.5 8-4 4.5-2.5 8-0.5 8 4 0 5-8 11-8 11S56 71 56 66z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
        },
        {
          href: '#', disabled: true,
          label: 'Kreativwerkstatt',
          imageSvg: '<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M90 18L44 82" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M50 74L58 64" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M44 82c-5 5-7 14-5 20 6 2 15-1 20-7L44 82z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M96 44l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5 2.5-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M78 26l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5 1.5-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'
        }
      ]
    });

    new NKSearch(document.getElementById('siteSearch'), {
      items: NKSearchData,
    });

    var menu = new NKMenu(
      document.getElementById('siteMenu'),
      Object.assign({}, NKMenu.THEMES.home, {
        headerEl: document.getElementById('siteHeader'),
        activeHref: 'vorschule.html',
        onItemClick: function(item) {
          if (item.href && item.href !== '#') window.location.href = item.href;
        }
      })
    );

    var header = new NKHeader(
      document.getElementById('siteHeader'),
      Object.assign({}, NKHeader.THEMES.home, {
        homeHref: 'index.html',
        onMenuClick: function() { menu.toggle(); }
      })
    );

    /* ─── FAB ───────────────────────────────── */
    var fab = new NKFab(document.getElementById('siteFab'), {
      mode: 'page',
      onSpeak: function() { NKVoice.speak(voiceText, function() { fab.done(); }); },
      onStop:  function() { NKVoice.stop(); },
    });
  </script>

</body>
</html>
