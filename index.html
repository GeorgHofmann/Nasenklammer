  <style>
    /* ─────────────────────────────────────────
       DESIGN TOKENS – Startseite (home/blau)
       ───────────────────────────────────────── */
    :root {
      --color-home-header:     #c8e0f4;   /* surface/saisonal/color-1-default  */
      --color-home-strip:      #75aee3;   /* surface/saisonal/color-1-hover    */
      --color-home-accent:     #225a93;   /* surface/saisonal/color-1-selected */
      --color-home-search-bg:  #c8e0f4;
      --color-home-search-icon:#963555;   /* rosa/700                          */
      --color-home-fab:        #f4a056;
      --color-home-fab-text:   #00363d;
      --nk-fab-bg:             #f4a056;
      --nk-fab-color:          #00363d;
      --nk-search-panel-bg:    rgba(165,200,230,0.97);
      --nk-search-trigger-bg:  rgba(200,224,244,0.62);
      --nk-search-icon-bg:     #963555;
      --nk-search-text:        #1a3a6c;
      --nk-search-placeholder: #5a7ea8;
      --nk-search-accent:      #225a93;

      /* Karussell: Seitenabstand passend zu .start-main (68px) */
      --nk-inset: 68px;

      --font-logo:    'Alcyone', 'Solway', Georgia, serif;
      --font-heading: 'Solway', Georgia, serif;
      --font-body:    'Noto Sans', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-home-strip);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── "Ich bin ein …" Strip ───────────────── */
    .start-strip {
      background: var(--color-home-strip);
      padding: 21px 56px;
    }

    .start-strip__text {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 400;
      line-height: 40px;
      color: var(--color-home-accent);
    }

    /* ── Hauptbereich: Karten ────────────────── */
    .start-main {
      flex: 1;
      background: var(--color-home-strip);
      padding: 12px 68px 160px;   /* unten Platz für die Suchleiste */
      display: flex;
      align-items: flex-start;
      position: relative;
      overflow: clip; /* clip statt hidden: Monster-SVG wird geclippt,
                          aber NKCarousel kann per neg. Margin full-bleed werden */
    }

    /* ── Monster-Illustration ────────────────── */
    .start-monster {
      position: absolute;
      right: -7px;
      bottom: 60px;
      width: 210px;
      height: 386px;
      opacity: 0.5;
      pointer-events: none;
      user-select: none;
      display: block;
      transition: transform var(--nk-dur) var(--nk-ease);
    }

    body.nk-search-open .start-monster {
      transform: translateY(calc(-1 * var(--nk-search-panel-height)));
    }

    @media (max-width: 900px) {
      .start-monster { display: none; }
    }


    /* ── Responsive ──────────────────────────── */
    @media (max-width: 900px) {
      .start-strip  { padding: 16px 20px; }
      .start-strip__text { font-size: 24px; }
      .start-main   { padding: 16px 20px 140px; }
      .start-bottom { padding: 16px 20px 24px; }
    }
  </style>
