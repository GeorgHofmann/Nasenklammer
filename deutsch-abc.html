<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO -->

  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://nasenklammer.de/deutsch-abc.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="Nasenklammer">
  <meta property="og:title" content="ABC – Buchstaben lernen – Nasenklammer">
  <meta property="og:description" content="ABC – Buchstaben und Anlaute üben für Grundschulkinder. Lerne, welcher Gegenstand mit welchem Buchstaben beginnt!">
  <meta property="og:url" content="https://nasenklammer.de/deutsch-abc.html">
  <meta property="og:image" content="https://nasenklammer.de/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ABC – Buchstaben lernen – Nasenklammer">
  <meta name="twitter:description" content="ABC – Buchstaben und Anlaute üben für Grundschulkinder.">
  <meta name="twitter:image" content="https://nasenklammer.de/og-image.png">
  <!-- /SEO -->
  <title>Nasenklammer – ABC</title>
  <link rel="stylesheet" href="components/fonts.css">
  <link rel="stylesheet" href="components/transitions.css">
  <link rel="stylesheet" href="components/logo.css">
  <link rel="stylesheet" href="components/header.css">
  <link rel="stylesheet" href="components/breadcrumb.css">
  <link rel="stylesheet" href="components/menu.css">
  <link rel="stylesheet" href="components/fab.css">
  <style>
    :root {
      --font-logo:    'Alcyone', 'Solway', Georgia, serif;
      --font-heading: 'Solway', Georgia, serif;
      --font-body:    'Noto Sans', Arial, sans-serif;
      --color-bg:     #F5C8D4;
      --color-accent: #963555;
      --nk-fab-bg:    #963555;
      --nk-fab-color: #F5C8D4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .ml-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .ml-iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
      min-height: calc(100vh - 120px);
    }
  </style>
</head>
<body>

  <div id="siteMenu"></div>
  <header id="siteHeader"></header>
  <div id="siteBreadcrumb"></div>

  <main class="ml-main">
    <iframe
      class="ml-iframe"
      src="module/abc-anlaut.html"
      title="ABC – Anlaute dem richtigen Buchstaben zuordnen"
      allow="autoplay"
    ></iframe>
  </main>

  <div id="siteFab"></div>

  <script src="components/button.js"></script>
  <script src="components/worksheet-pdf.js"></script>
  <script src="components/analytics.js"></script>
  <script src="components/voice.js"></script>
  <script src="components/fab.js"></script>
  <script src="components/transitions.js"></script>
  <script src="components/logo.js"></script>
  <script src="components/icons.js"></script>
  <script src="components/menu.js"></script>
  <script src="components/header.js"></script>
  <script src="components/breadcrumb.js"></script>
  <script>
    'use strict';

    var DEUTSCH_THEME = { color: '#963555' };

    var voiceText =
      'Auf der linken Seite siehst du drei Bilder. ' +
      'Auf der rechten Seite steht ein Buchstabe. ' +
      'Zieh das Bild, das mit diesem Buchstaben beginnt, auf die rechte Seite. ' +
      'Mit den Pfeilen kannst du zum nächsten oder vorherigen Buchstaben springen.';

    var menu = new NKMenu(
      document.getElementById('siteMenu'),
      Object.assign({}, NKMenu.THEMES.deutsch, DEUTSCH_THEME, {
        activeHref: 'deutsch-abc.html',
        headerEl: document.getElementById('siteHeader'),
        onItemClick: function(item) {
          if (item.href && item.href !== '#') window.location.href = item.href;
        }
      })
    );

    var header = new NKHeader(
      document.getElementById('siteHeader'),
      Object.assign({}, NKHeader.THEMES.deutsch, {
        homeHref: 'index.html',
        onMenuClick: function() { menu.toggle(); }
      })
    );

    var breadcrumb = new NKBreadcrumb(
      document.getElementById('siteBreadcrumb'),
      Object.assign({}, NKBreadcrumb.THEMES.deutsch, DEUTSCH_THEME, {
        themaConnector: 'das',
        slots: {
          klasse: { label: 'Grundschulkind', href: 'index.html' },
          fach:   { label: 'Deutsch',         href: 'grundschule-faecher.html' },
          thema:  { label: 'ABC',             href: 'deutsch.html' },
        },
        onSlotClick: function(key, slot) {
          if (slot.href) window.location.href = slot.href;
        },
        menuItems: []
      })
    );

    var fab = new NKFab(document.getElementById('siteFab'), {
      mode: 'module',
      onSpeak: function() { NKVoice.speak(voiceText, function() { fab.done(); }); },
      onStop:  function() { NKVoice.stop(); },
    });
  </script>

</body>
</html>
